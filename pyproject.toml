[project]
name = "videorag"
version = "0.1.0"
description = "Multilingual query-driven video segment retrieval — cross-lingual RAG over spoken video content."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "chromadb>=0.5.20",
    "slowapi>=0.1.9",
    "cachetools>=5.5",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Heavy, model-backed dependencies. Every import of these is lazy (loaded only
# inside the class method that needs it), so the API and full test suite run
# fine without this extra installed — only real transcription/embedding/LLM
# calls need it. Installed in the API Docker image; not installed in CI.
ml = [
    "sentence-transformers>=3.2",
    "faster-whisper>=1.0.3",
    "google-generativeai>=0.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videorag"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends()-in-default is the intended idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
