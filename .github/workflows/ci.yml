name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: black --check src tests scripts

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests --cov=videorag --cov-report=term-missing -v

  eval-fixture:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run eval harness on tiny CI fixture (fake embedder, no model download)
        run: |
          python scripts/run_eval.py \
            --dataset eval/fixture/dataset.json \
            --output eval/fixture-results.json \
            --markdown-output eval/fixture-results.md \
            --fake-embedder \
            --min-hit-rate 1.0
      - uses: actions/upload-artifact@v4
        with:
          name: eval-fixture-results
          path: |
            eval/fixture-results.json
            eval/fixture-results.md

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t videorag-api:ci -f Dockerfile .
      - name: Build frontend image
        run: docker build -t videorag-frontend:ci -f frontend/Dockerfile frontend
